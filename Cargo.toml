[package]
name = "oplus_cryptoeng_stub"
version = "0.1.0"
edition = "2024"

[dependencies]
rsbinder = { version = "0.12.0", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
aes-gcm = "0.10"
inventory = "0.3"
tracing-logcat = "0.1.0"

[build-dependencies]
rsbinder-aidl = "0.12.0"

[lib]
name = "oplus_cryptoeng_stub"
path = "src/lib.rs"

[[bin]]
name = "vendor-oplus-hardware-cryptoeng-service"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
