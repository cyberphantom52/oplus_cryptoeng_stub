[package]
name = "oplus_cryptoeng_stub"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.89"
rsbinder = "0.5.0"
tracing = "0.1"
tracing-android = "0.2"
tracing-subscriber = { version = "0.3", default-features = false }
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
rsbinder-aidl = "0.5.0"

[lib]
name = "oplus_cryptoeng_stub"
path = "src/lib.rs"

[[bin]]
name = "vendor-oplus-hardware-cryptoeng-service"
path = "src/main.rs"
