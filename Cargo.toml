[package]
name = "oplus_cryptoeng_stub"
version = "0.1.0"
edition = "2024"

[dependencies]
rsbinder = { version = "0.12.0", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
aes-gcm = "0.10"
inventory = "0.3"
rustix = { version = "1.1.4", features = ["time", "fs", "process"] }
tracing-logcat = "0.1.0"
x509-cert = { version = "0.3", features = ["builder"] }

rsa = { version = "=0.10.0-rc.19", features = ["sha2"] }
sha1 = "0.11"
sha2_11 = { package = "sha2", version = "0.11", features = ["oid"] }
p224 = { version = "=0.14.0-rc.15", features = ["pem"] }
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pem"] }
p521 = { version = "0.14", features = ["ecdsa", "pem"] }
zeroize = "1"
rsproperties = "0.6"

[build-dependencies]
rsbinder-aidl = "0.12.0"

[lib]
name = "oplus_cryptoeng_stub"
path = "src/lib.rs"

[[bin]]
name = "vendor-oplus-hardware-cryptoeng-service"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
